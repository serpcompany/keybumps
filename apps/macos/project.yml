name: Keybumps
configs:
  Debug: debug
  Release: release
options:
  bundleIdPrefix: com.serp
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    ARCHS: arm64
    MARKETING_VERSION: 0.0.2
    CURRENT_PROJECT_VERSION: 2
    ENABLE_HARDENED_RUNTIME: YES
    KEYBUMPS_UPDATE_FEED_URL: ""
    KEYBUMPS_UPDATE_PUBLIC_KEY: ""
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
targets:
  Keybumps:
    type: application
    platform: macOS
    sources:
      - path: Keybumps
        excludes:
          - Resources/Keybumps.icon
      # The app icon: an Icon Composer file Xcode compiles into the asset catalog, with
      # fallbacks for macOS before 26.
      - path: Keybumps/Resources/Keybumps.icon
        type: file
        buildPhase: resources
      - path: LICENSE.rectangle
        buildPhase: resources
      - path: LICENSE.shotnix
        buildPhase: resources
      - path: LICENSE.tock
        buildPhase: resources
      - path: LICENSE.argmax-oss-swift
        buildPhase: resources
      - path: NOTICES.argmax-oss-swift
        buildPhase: resources
      - path: LICENSE.openai-whisper
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.keybumps
        PRODUCT_NAME: Keybumps
        PRODUCT_MODULE_NAME: Keybumps
        EXECUTABLE_NAME: Keybumps
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Keybumps/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: Keybumps
        CODE_SIGN_ENTITLEMENTS: Keybumps/Resources/Keybumps.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W3GXL2NQQP
        ENABLE_APP_SANDBOX: NO
      configs:
        # Debug builds (the unit- and UI-test host, build-and-run.sh) get their own identity so they
        # never share preferences, permissions, or quit requests with the installed app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.serp.keybumps.debug
    dependencies:
      - package: Sparkle
      - package: ArgmaxOSS
        product: WhisperKit
    postCompileScripts:
      - name: Bundle this release's notes for What's New
        # build-update-release.sh and build-qa-candidate.sh pass KEYBUMPS_RELEASE_NOTES; other builds carry none (#225).
        script: |
          notes="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/WhatsNew.md"
          if [ -n "${KEYBUMPS_RELEASE_NOTES:-}" ] && [ -f "$KEYBUMPS_RELEASE_NOTES" ]; then
            cp "$KEYBUMPS_RELEASE_NOTES" "$notes"
          else
            rm -f "$notes"
          fi
        basedOnDependencyAnalysis: false
    preBuildScripts:
      - name: Validate Keybumps release configuration
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            if /usr/bin/env | /usr/bin/grep -q '^SUPERMAC_'; then
              echo "error: legacy SUPERMAC_* release variables are forbidden"
              exit 1
            fi
            case "$KEYBUMPS_UPDATE_FEED_URL" in
              "https://updates.keybumps.app/appcast.xml"|"https://updates.keybumps.app/staging/appcast.xml") ;;
              *) echo "error: KEYBUMPS_UPDATE_FEED_URL must be a canonical Keybumps feed"; exit 1 ;;
            esac
            if [ -z "$KEYBUMPS_UPDATE_PUBLIC_KEY" ]; then
              echo "error: KEYBUMPS_UPDATE_PUBLIC_KEY is required for Release builds"
              exit 1
            fi
          fi
  KeybumpsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KeybumpsTests
    dependencies:
      - target: Keybumps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.keybumps.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W3GXL2NQQP
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Keybumps.app/Contents/MacOS/Keybumps"
        BUNDLE_LOADER: "$(TEST_HOST)"
  KeybumpsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - KeybumpsUITests
    dependencies:
      - target: Keybumps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.keybumps.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W3GXL2NQQP
        TEST_TARGET_NAME: Keybumps
schemes:
  Keybumps:
    build:
      targets:
        Keybumps: all
        KeybumpsTests: [test]
    test:
      targets:
        - KeybumpsTests
  Keybumps-Release:
    build:
      targets:
        Keybumps: all
    run:
      config: Release
    archive:
      config: Release
  KeybumpsUITests:
    build:
      targets:
        Keybumps: all
        KeybumpsUITests: [test]
    test:
      targets:
        - KeybumpsUITests
