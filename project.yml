name: SuperMac
configs:
  Debug: debug
  Release: release
options:
  bundleIdPrefix: com.serp
  deploymentTarget:
    macOS: "14.2"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    ARCHS: arm64
    MARKETING_VERSION: 0.0.2
    CURRENT_PROJECT_VERSION: 2
    ENABLE_HARDENED_RUNTIME: YES
    SUPERMAC_UPDATE_FEED_URL: ""
    SUPERMAC_UPDATE_PUBLIC_KEY: ""
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  SuperMac:
    type: application
    platform: macOS
    sources:
      - SuperMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.supermac
        PRODUCT_NAME: SuperMac
        PRODUCT_MODULE_NAME: SuperMac
        EXECUTABLE_NAME: SuperMac
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SuperMac/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SuperMac/Resources/SuperMac.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 847HR8U8D9
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - package: Sparkle
  SuperMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SuperMacTests
    dependencies:
      - target: SuperMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serp.supermac.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 847HR8U8D9
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SuperMac.app/Contents/MacOS/SuperMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SuperMac:
    build:
      targets:
        SuperMac: all
        SuperMacTests: [test]
    test:
      targets:
        - SuperMacTests
  SuperMac-Release:
    build:
      targets:
        SuperMac: all
    run:
      config: Release
    archive:
      config: Release
