name: Keybumps unit tests

# Runs on pull requests that touch app code, as the first gate of Release Keybumps, and
# manually from Actions. No nightly schedule.
on:
  pull_request:
    branches: [main]
    paths:
      - Keybumps/**
      - KeybumpsTests/**
      - scripts/**
      - project.yml
      - .github/workflows/keybumps-unit-tests.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keybumps-unit-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  unit:
    name: Unit tests (KeybumpsTests)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Keybumps project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Keybumps.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Keybumps.xcodeproj -scheme Keybumps \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .derived-ci -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Run KeybumpsTests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Keybumps.xcodeproj -scheme Keybumps \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .derived-ci -clonedSourcePackagesDirPath .spm \
            -only-testing:KeybumpsTests \
            -resultBundlePath KeybumpsTests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KeybumpsTests-xcresult
          path: KeybumpsTests.xcresult
          retention-days: 7
