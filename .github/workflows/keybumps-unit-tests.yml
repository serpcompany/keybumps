name: Keybumps unit tests

# Runs on pull requests that touch app code, as the first gate of Release Keybumps, and
# manually from Actions. No nightly schedule.
on:
  pull_request:
    branches: [main]
    # Filters can't use APP_DIR; keep them in step with it. Outside it, the tests read only the
    # release notes (UpdateVisibilityTests parses every docs/releases/v*.md).
    paths:
      - apps/macos/**
      - docs/releases/**
      - .github/workflows/keybumps-unit-tests.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keybumps-unit-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  # The Mac app's folder, relative to the repository root. Run steps work in it. Action inputs
  # (the cache, hashFiles, and upload paths) are relative to the repository root, so they add
  # the folder (and use bare paths if it is ".", the repository root). See docs/adr/0003.
  APP_DIR: apps/macos

jobs:
  unit:
    name: Unit tests (KeybumpsTests)
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Keybumps project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR == '.' && '.spm' || format('{0}/.spm', env.APP_DIR) }}
          key: spm-${{ runner.os }}-${{ hashFiles(env.APP_DIR == '.' && 'Keybumps.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved' || format('{0}/Keybumps.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', env.APP_DIR)) }}

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Keybumps.xcodeproj -scheme Keybumps \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .derived-ci -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | xcbeautify --renderer github-actions

      - name: Run KeybumpsTests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Keybumps.xcodeproj -scheme Keybumps \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .derived-ci -clonedSourcePackagesDirPath .spm \
            -only-testing:KeybumpsTests \
            -resultBundlePath KeybumpsTests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KeybumpsTests-xcresult
          path: ${{ env.APP_DIR == '.' && 'KeybumpsTests.xcresult' || format('{0}/KeybumpsTests.xcresult', env.APP_DIR) }}
          retention-days: 7
