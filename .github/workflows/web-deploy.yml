name: Web deploy

# Deploys the keybumps.app website in apps/web after merge: `pnpm check`, then staging and its smoke
# test, then production and its smoke test. This is the only deploy path (apps/web/docs/agents/
# web.md, Deploys). The owner's approval of the pull request authorizes its production deploy.
#
# Smoke tests use each Worker's workers.dev URL from the deploy log, with the smoke-test header,
# because the zone's bot protection blocks CI runners on the branded domains.
#
# CLOUDFLARE_API_TOKEN is account-wide (Cloudflare can't scope it to one Worker), so only the two
# Deploy steps get it. Use it only for keybumps-web-staging and keybumps-web-production. If a
# deploy fails with an authorization error, ask the owner; don't widen the token.
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# A running deploy is never cancelled. At most one newer run waits, and it replaces any older
# waiting run, which is safe because it deploys the newer main.
concurrency:
  group: web-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: apps/web

jobs:
  check:
    name: Website check (pnpm check)
    # A manual run from another branch must not deploy it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm check
        run: pnpm check

  staging:
    name: Deploy staging (keybumps-web-staging)
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds with SITE_ENV=staging and deploys --env staging, whose vars set it at runtime. The
      # placeholder GTM ID makes the smoke test's "no GTM on /" check the SITE_ENV gate itself.
      # GitHub runs bash with pipefail, so a failed deploy fails this step through tee.
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_GTM_ID: GTM-STAGING0
        run: pnpm deploy:staging 2>&1 | tee deploy.log

      - name: Smoke test
        run: |
          url="$(grep -oE 'https://keybumps-web-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1 || true)"
          if [ -z "$url" ]; then
            echo "::error::No keybumps-web-staging workers.dev URL in the deploy log"
            exit 1
          fi
          ./scripts/smoke.sh "$url" staging

  production:
    name: Deploy production (keybumps-web-production)
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The production smoke test requires GTM on /, so stop before deploying a build without it.
      - name: Require the GTM container ID
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_GTM_ID" ]; then
            echo "::error::Set NEXT_PUBLIC_GTM_ID on the production environment"
            exit 1
          fi

      # Builds with SITE_ENV=production and deploys --env production, whose vars set it at
      # runtime. Only the public GTM ID is passed: NEXT_PUBLIC_CF_BEACON_TOKEN stays unset until
      # the privacy policy covers Cloudflare Web Analytics.
      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
        run: pnpm deploy:production 2>&1 | tee deploy.log

      - name: Smoke test
        run: |
          url="$(grep -oE 'https://keybumps-web-production\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1 || true)"
          if [ -z "$url" ]; then
            echo "::error::No keybumps-web-production workers.dev URL in the deploy log"
            exit 1
          fi
          ./scripts/smoke.sh "$url" production
