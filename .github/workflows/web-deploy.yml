name: Web deploy

# Deploys the keybumps.app website in apps/web after merge: `pnpm check:code` (lint, typecheck,
# tests), then staging and its smoke test, then production and its smoke test. Each deploy job's
# build is the build check, so the check job doesn't build (SERP ci-workflows standard). Each
# deploys only if main has no newer website changes (scripts/deploy-tip.sh). This is the only
# deploy path (apps/web/docs/agents/web.md, Deploys). The merge authorizes its production deploy:
# the owner's, or an agent's under the root AGENTS.md's listed paths.
#
# Smoke tests use each Worker's workers.dev URL from the deploy log, with the smoke-test header,
# because the zone's bot protection blocks CI runners on the branded domains.
#
# CLOUDFLARE_API_TOKEN is account-wide (Cloudflare can't scope it to one Worker), so only the two
# Deploy steps get it. Use it only for keybumps-web-staging and keybumps-web-production. If a
# deploy fails with an authorization error, ask the owner; don't widen the token.
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# A running deploy is never cancelled. At most one newer run waits, and it replaces any older
# waiting run, which is safe because it deploys the newer main.
concurrency:
  group: web-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: apps/web

jobs:
  check:
    name: Website check (pnpm check:code)
    # A manual run from another branch must not deploy it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No build here: the staging and production builds below are the build check.
      - name: Run pnpm check:code
        run: pnpm check:code

  staging:
    name: Deploy staging (keybumps-web-staging)
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The website has its own GitHub environments, separate from the Mac release's `production`.
    # CLOUDFLARE_API_TOKEN lives on website-staging and website-production, which accept only main.
    environment: website-staging
    outputs:
      deployed: ${{ steps.tip.outputs.deploy }}
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds with SITE_ENV=staging; --env staging's vars set it at runtime. The placeholder GTM ID
      # makes the smoke test's "no GTM on /" check the SITE_ENV gate itself.
      - name: Build
        env:
          NEXT_PUBLIC_GTM_ID: GTM-STAGING0
        run: pnpm build:staging

      # Deploy only the newest website: skip when main has newer website changes, whose own run
      # deploys them, so a re-run of an older run never deploys over newer code.
      - name: Check main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/deploy-tip.sh

      # GitHub runs bash with pipefail, so a failed deploy fails this step through tee.
      - name: Deploy
        if: steps.tip.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec opennextjs-cloudflare deploy --env staging 2>&1 | tee deploy.log

      - name: Smoke test
        if: steps.tip.outputs.deploy == 'true'
        run: |
          url="$(grep -oE 'https://keybumps-web-staging\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1 || true)"
          if [ -z "$url" ]; then
            echo "::error::No keybumps-web-staging workers.dev URL in the deploy log"
            exit 1
          fi
          ./scripts/smoke.sh "$url" staging

  production:
    name: Deploy production (keybumps-web-production)
    needs: staging
    # Staging skipped its deploy because main has newer website changes; production does too.
    if: github.ref == 'refs/heads/main' && needs.staging.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: website-production
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The production smoke test requires GTM on /, so stop before deploying a build without it.
      - name: Require the GTM container ID
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_GTM_ID" ]; then
            echo "::error::Set NEXT_PUBLIC_GTM_ID on the website-production environment"
            exit 1
          fi

      # Builds with SITE_ENV=production; --env production's vars set it at runtime. Only the public
      # GTM ID is passed: NEXT_PUBLIC_CF_BEACON_TOKEN stays unset until the privacy policy covers
      # Cloudflare Web Analytics.
      - name: Build
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
        run: pnpm build:production

      - name: Check main's tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/deploy-tip.sh

      - name: Deploy
        if: steps.tip.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec opennextjs-cloudflare deploy --env production 2>&1 | tee deploy.log

      - name: Smoke test
        if: steps.tip.outputs.deploy == 'true'
        run: |
          url="$(grep -oE 'https://keybumps-web-production\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1 || true)"
          if [ -z "$url" ]; then
            echo "::error::No keybumps-web-production workers.dev URL in the deploy log"
            exit 1
          fi
          ./scripts/smoke.sh "$url" production
