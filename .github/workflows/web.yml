name: Website checks

# Checks the keybumps.app website in apps/web with `pnpm check`: Biome, TypeScript, Vitest, and an
# OpenNext build. Runs on pull requests to main that touch the site and manually from Actions. It
# never deploys; web-deploy.yml deploys after merge.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    name: Website check (pnpm check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm check
        run: pnpm check
