name: Check release credentials

# Read-only: reports which release secrets are configured and verifies R2 access. Never uploads.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    env:
      CLOUDFLARE_ACCOUNT_ID: cec5f04e1d18bcc65f2be0aefb04f059
    steps:
      - name: Report configured secrets
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          for name in DEVELOPER_ID_CERTIFICATE_P12 DEVELOPER_ID_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY SPARKLE_PRIVATE_KEY CLOUDFLARE_R2_TOKEN; do
            if [ -n "${!name}" ]; then echo "✅ $name"; else echo "❌ $name"; fi
          done
          # Optional: without it, crash reports from a release aren't symbolicated (ADR 0007).
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then echo "✅ SENTRY_AUTH_TOKEN"; else echo "⚠️ SENTRY_AUTH_TOKEN (optional)"; fi

      - name: Verify R2 read access to keybumps-updates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_R2_TOKEN is not set"; exit 1; }
          npx --yes wrangler@4.142.0 r2 object get keybumps-updates/appcast.xml --remote --pipe > appcast.xml
          grep -q "<rss" appcast.xml && echo "✅ R2 token can read keybumps-updates (appcast $(wc -c < appcast.xml) bytes)"
