name: Release Please

# Keeps a "release: Keybumps x.y.z" PR up to date from Conventional Commits on main.
# Merging that PR tags the release and runs Release Keybumps; nothing else releases.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      publish: true
      # Repository variable KEYBUMPS_NOTARIZE=false ships a signed but un-notarized release, only
      # with owner authorization while notarization is unavailable. Unset it to notarize again.
      notarize: ${{ vars.KEYBUMPS_NOTARIZE != 'false' }}
    secrets: inherit
