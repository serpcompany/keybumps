name: Release Please

# Keeps a "release: Keybumps x.y.z" PR up to date from Conventional Commits on main.
# Merging that PR tags the release and runs Release Keybumps; nothing else releases.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      publish: true
      # Repository variable KEYBUMPS_NOTARIZE=false ships a signed but un-notarized release, only
      # with owner authorization while notarization is unavailable. Unset it to notarize again.
      notarize: ${{ vars.KEYBUMPS_NOTARIZE != 'false' }}
    secrets: inherit

  # After the release publishes to production, start a Web deploy run on main so /changelog/ lists it
  # (#427). Not when the release PR merges: that's before the build is published. A started run
  # builds main's tip, so it can only stand in for a waiting deploy of something older, and it
  # shows in Web deploy's own runs; its result doesn't turn this run red. GITHUB_TOKEN may start
  # workflow_dispatch runs. `actions: write` also lets a job cancel, re-run, or delete runs and
  # their logs, artifacts, and caches; this job's only step is a fixed command with no event input.
  # If that step fails, re-run the failed jobs here, which re-runs this one.
  website:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start Web deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run web-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
