name: Release Keybumps

# Manual only: merging to main never builds or publishes a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (needs docs/releases/v<version>.md), e.g. 0.0.3-beta.4
        required: true
        type: string
      build:
        description: Build number (blank = live production build + 1)
        required: false
        type: string
      channel:
        description: Where to publish the appcast pointer
        required: true
        type: choice
        options: [staging, production]
        default: staging
      publish:
        description: Upload to updates.keybumps.app (off = build, notarize, and keep artifacts only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: keybumps-release
  cancel-in-progress: false

env:
  FEED_URL: https://updates.keybumps.app/appcast.xml
  # Public Sparkle EdDSA key embedded in every Keybumps build (matches the private key secret).
  UPDATE_PUBLIC_KEY: qier19/D8RhLykVkhe92L3gatkAU6i/Q22/VgmjkeKc=
  SPARKLE_VERSION: 2.10.0
  SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
  SPARKLE_ACCOUNT: keybumps-release
  CLOUDFLARE_ACCOUNT_ID: cec5f04e1d18bcc65f2be0aefb04f059
  WRANGLER_VERSION: 4.142.0

jobs:
  release:
    runs-on: macos-26
    environment: release
    timeout-minutes: 120
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1

      - name: Check required secrets
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_R2_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          missing=()
          for name in DEVELOPER_ID_CERTIFICATE_P12 DEVELOPER_ID_CERTIFICATE_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "$PUBLISH" = true ] && [ -z "$CLOUDFLARE_R2_TOKEN" ]; then missing+=(CLOUDFLARE_R2_TOKEN); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]} (see docs/releases/sparkle-update-operations.md)"
            exit 1
          fi

      - name: Install release tools
        run: |
          brew install xcodegen asc
          npm install --global "wrangler@${WRANGLER_VERSION}"
          curl --fail --silent --show-error --location \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            --output "$RUNNER_TEMP/sparkle.tar.xz"
          echo "${SPARKLE_SHA256}  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" bin
          echo "SPARKLE_TOOLS=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Check R2 access
        if: inputs.publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: wrangler r2 object get keybumps-updates/appcast.xml --remote --pipe > /dev/null

      - name: Resolve version and build
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ inputs.build }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version: $VERSION"; exit 1; }
          [ -f "docs/releases/v${VERSION}.md" ] || { echo "::error::Missing docs/releases/v${VERSION}.md"; exit 1; }
          previous=$(curl --fail --silent --show-error "$FEED_URL" | xmllint --xpath 'string(//*[local-name()="item"][1]/*[local-name()="version"])' -)
          [[ "$previous" =~ ^[0-9]+$ ]] || { echo "::error::Could not read the live production build"; exit 1; }
          build=${BUILD:-$((previous + 1))}
          [[ "$build" =~ ^[0-9]+$ ]] && [ "$build" -gt "$previous" ] || { echo "::error::Build $build must exceed live build $previous"; exit 1; }
          {
            echo "RELEASE_VERSION=$VERSION"
            echo "RELEASE_BUILD=$build"
            echo "PREVIOUS_BUILD=$previous"
          } >> "$GITHUB_ENV"
          echo "Keybumps $VERSION ($build), replacing live build $previous"

      - name: Set up signing keychain
        env:
          DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          echo "$DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application" || { echo "::error::No Developer ID Application identity in the certificate secret"; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle-private-key"
          "$SPARKLE_TOOLS/generate_keys" --account "$SPARKLE_ACCOUNT" -f "$RUNNER_TEMP/sparkle-private-key"
          rm -f "$RUNNER_TEMP/sparkle-private-key"
          [ "$("$SPARKLE_TOOLS/generate_keys" --account "$SPARKLE_ACCOUNT" -p)" = "$UPDATE_PUBLIC_KEY" ] || { echo "::error::Sparkle private key does not match the embedded public key"; exit 1; }
          echo "RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and package
        env:
          KEYBUMPS_MANUAL_SIGNING: "1"
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_BYPASS_KEYCHAIN: "1"
        run: |
          ./scripts/build-update-release.sh "$RELEASE_VERSION" "$RELEASE_BUILD" "$PREVIOUS_BUILD" \
            "$FEED_URL" "$UPDATE_PUBLIC_KEY" "$SPARKLE_ACCOUNT" "$SPARKLE_TOOLS" "$RUNNER_TEMP/release"

      - name: Preview publication
        env:
          CHANNEL: ${{ inputs.channel }}
        run: ./scripts/publish-release.sh "$RUNNER_TEMP/release" "$CHANNEL"

      - name: Keep release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keybumps-${{ env.RELEASE_VERSION }}-${{ env.RELEASE_BUILD }}
          path: ${{ runner.temp }}/release/publication
          if-no-files-found: error
          retention-days: 90

      - name: Publish to updates.keybumps.app
        if: inputs.publish
        env:
          CHANNEL: ${{ inputs.channel }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
        run: ./scripts/publish-release.sh "$RUNNER_TEMP/release" "$CHANNEL" --publish

      - name: Remove signing keychain
        if: always()
        run: |
          [ -n "${RELEASE_KEYCHAIN:-}" ] && security delete-keychain "$RELEASE_KEYCHAIN" || true
