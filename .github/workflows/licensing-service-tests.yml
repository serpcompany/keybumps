name: Licensing service tests

# Runs the SERP licensing service's own tests (services/licensing). Kept apart from the
# Swift app's jobs; see docs/adr/0001-licensing.md.
on:
  pull_request:
    branches: [main]
    paths:
      - services/licensing/**
      - .github/workflows/licensing-service-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: licensing-service-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Licensing service (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/licensing
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/licensing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
