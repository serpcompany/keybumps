name: Keybumps UI tests

# UI tests launch an ad-hoc signed build with faked permissions and disabled global hot keys
# (see docs/testing.md). Runs on every pull request (its UI job only when the PR touches app code),
# as a gate of Release Keybumps, and manually from Actions. No nightly schedule. The `changes` job's
# pattern can't use APP_DIR; keep it in step with it.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keybumps-ui-tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  # The Mac app's folder, relative to the repository root. Run steps work in it. Action inputs
  # (the cache, hashFiles, and upload paths) are relative to the repository root, so they add
  # the folder (and use bare paths if it is ".", the repository root). See docs/adr/0003.
  APP_DIR: apps/macos

jobs:
  # Required checks must report on every pull request, so this workflow has no `paths:` filter.
  # This job decides whether the slow job below runs (.github/scripts/pr-touches.sh).
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.touches.outputs.run }}
    steps:
      - name: Check out the scripts
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Does this PR touch app code?
        id: touches
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/pr-touches.sh '^(apps/macos/|\.github/workflows/keybumps-ui-tests\.yml$|\.github/scripts/pr-touches\.sh$)'

  ui:
    name: UI tests (with retries)
    needs: changes
    # Skipped (which counts as passing) only when the PR touches none of the files it checks.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "Runner image $ImageOS $ImageVersion"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Keybumps project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        # Local packages' binary targets (whisper.cpp) aren't in Package.resolved, so their
        # Package.swift is part of the key too.
        with:
          path: ${{ env.APP_DIR == '.' && '.spm' || format('{0}/.spm', env.APP_DIR) }}
          key: spm-${{ runner.os }}-${{ hashFiles(env.APP_DIR == '.' && 'Keybumps.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved' || format('{0}/Keybumps.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', env.APP_DIR), env.APP_DIR == '.' && 'Packages/*/Package.swift' || format('{0}/Packages/*/Package.swift', env.APP_DIR)) }}

      - name: Build for testing (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Keybumps.xcodeproj -scheme KeybumpsUITests \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .derived-ui -clonedSourcePackagesDirPath .spm \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=YES ENABLE_HARDENED_RUNTIME=NO \
            | xcbeautify --renderer github-actions

      - name: Run UI suite with retries
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Keybumps.xcodeproj -scheme KeybumpsUITests \
            -destination 'platform=macOS' \
            -derivedDataPath .derived-ui -clonedSourcePackagesDirPath .spm \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath KeybumpsUITests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KeybumpsUITests-xcresult
          path: ${{ env.APP_DIR == '.' && 'KeybumpsUITests.xcresult' || format('{0}/KeybumpsUITests.xcresult', env.APP_DIR) }}
          retention-days: 7
