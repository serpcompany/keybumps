name: Keybumps UI tests

# UI tests launch an ad-hoc signed build with faked permissions and disabled global hot keys
# (see docs/testing.md). Pull requests run the smoke suite; nightly and manual runs run the
# whole KeybumpsUITests target with retries. The nightly run is skipped when main already
# passed a scheduled run at the same commit, so unchanged days cost only a short Linux job.

on:
  pull_request:
    branches: [main]
    paths:
      - Keybumps/**
      - KeybumpsUITests/**
      - project.yml
      - .github/workflows/keybumps-ui-tests.yml
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: keybumps-ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_26.6.app

jobs:
  changes:
    name: Check for new commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow keybumps-ui-tests.yml \
            --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // ""') || last=""
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is unchanged since the last green nightly run ($GITHUB_SHA); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  ui:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: ${{ github.event_name == 'pull_request' && 'UI smoke tests' || 'UI tests (full, with retries)' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out Keybumps
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "Runner image $ImageOS $ImageVersion"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Keybumps project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Keybumps.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build for testing (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Keybumps.xcodeproj -scheme KeybumpsUITests \
            -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .derived-ui -clonedSourcePackagesDirPath .spm \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=YES ENABLE_HARDENED_RUNTIME=NO \
            | xcbeautify --renderer github-actions

      - name: Run UI smoke tests
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Keybumps.xcodeproj -scheme KeybumpsUITests \
            -destination 'platform=macOS' \
            -derivedDataPath .derived-ui -clonedSourcePackagesDirPath .spm \
            -only-testing:KeybumpsUITests/SmokeUITests \
            -resultBundlePath KeybumpsUITests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Run full UI suite with retries
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Keybumps.xcodeproj -scheme KeybumpsUITests \
            -destination 'platform=macOS' \
            -derivedDataPath .derived-ui -clonedSourcePackagesDirPath .spm \
            -retry-tests-on-failure -test-iterations 3 \
            -resultBundlePath KeybumpsUITests.xcresult \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KeybumpsUITests-xcresult
          path: KeybumpsUITests.xcresult
          retention-days: 7
